[package]
name = "dbml-studio"
version = "0.1.0"
description = "Local-first database modeling with DBML"
authors = ["DBML Studio"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dbml_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
